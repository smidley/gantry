name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - run: make lint
      - run: go test ./... -race
      - run: go test -tags dockertest ./internal/collect/docker/ -race
      - run: make build
      - run: docker build -t gantry:ci .
