name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets release.yml re-run this exact suite against a tag

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      # Node/web setup moved ahead of lint: `make lint` now also compiles
      # the -tags webdist build (see the Makefile's own comment on that),
      # which needs internal/server/webdist populated first -- `make web`
      # below is what populates it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./internal/server/ -count=1  # untagged build needs zero node artifacts
      - run: make web
      # v9 is the current major; per its README's Compatibility section,
      # v7.0.0+ supports golangci-lint v2 only -- v6 unconditionally passed
      # a v1-only --out-format flag that v2's CLI rejects outright, failing
      # the step before golangci-lint ever ran a single rule. version is
      # pinned to the v2 line .golangci.yml's own `version: "2"` requires,
      # rather than left floating on `latest`, so a future v3 release can't
      # silently reintroduce this same class of mismatch.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - run: make lint
      - run: go test ./... -race
      - run: go test -tags dockertest ./internal/collect/docker/ -race
      - run: make build
      - run: cd web && npm run check && npm test
      - run: cd web && npm audit --audit-level=high
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: python3 scripts/check_go_vulns.py
      - run: docker build -t gantry:ci .
      - run: python3 scripts/test_docker_proxy.py
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0; pinned after upstream remediation
        with:
          image-ref: gantry:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.69.3
          vuln-type: os


  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium firefox
      - run: cd web && npx playwright test

      - run: cd web && GANTRY_PIPELINE=1 npx playwright test --project=pipeline --workers=1
