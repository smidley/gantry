global
  maxconn 256

defaults
  mode http
  timeout connect 5s
  timeout client 65s
  timeout server 65s
  timeout http-request 10s
  timeout http-keep-alive 10s

# Only this small intermediary holds the raw Docker socket. No TCP listener.
frontend monitor
  bind /run/proxy/docker.sock mode 660
  acl read_method method GET HEAD
  acl inventory path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|info|events|containers/json|images/json|system/df)$
  acl container_read path_reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-f0-9]{12,64}/(json|stats|logs)$
  http-request deny deny_status 403 unless read_method
  http-request deny deny_status 403 unless inventory or container_read
  default_backend docker

backend docker
  server engine /var/run/docker.sock
